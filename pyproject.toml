[project]
name = "hyperzeta"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["matplotlib>=3.10.9", "mlx>=0.31.2", "scipy>=1.17.1"]

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "hyperzeta"
module-root = ""

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "isort>=8.0.1",
    "jupyter>=1.1.1",
    "matplotlib-inline>=0.2.2",
    "mkinit>=1.2.0",
    "pandas>=3.0.3",
    "tqdm>=4.67.3",
]
